      "NeedsCompilation": "yes",
      "Author": "Dirk Eddelbuettel [aut, cre] (<https://orcid.org/0000-0001-6419-907X>)",
      "Maintainer": "Dirk Eddelbuettel <edd@debian.org>",
      "Repository": "CRAN"
    },
